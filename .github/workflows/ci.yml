name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Unused imports and undefined names are the two ways a refactor silently
      # loses behaviour in a codebase this thin, so they fail the build.
      - run: pyflakes app tests
      - run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Containerfile -t fun-prompts:smoke .
      - name: Start container
        run: |
          docker run -d --name fun-prompts \
            -p 8080:8080 -p 8081:8081 \
            -e FP_ARTIFACT_BASE_URL=http://localhost:8081 \
            -e ADMIN_PASSWORD=ci-only-password \
            fun-prompts:smoke
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then healthy=1; break; fi
            sleep 2
          done
          test "${healthy:-0}" = 1
      - name: Check served pages
        run: |
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '/static/htmx.min.js'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ | grep -qi 'content-security-policy'
      - name: Container logs on failure
        if: failure()
        run: docker logs fun-prompts

  build-push:
    needs: [test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
