name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Unused imports and undefined names are the two ways a refactor silently
      # loses behaviour in a codebase this thin, so they fail the build.
      - run: pyflakes app tests
      - run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Containerfile -t fun-prompts:smoke .
      - name: Start container
        run: |
          docker run -d --name fun-prompts \
            -p 8080:8080 -p 8081:8081 \
            -e FP_ARTIFACT_BASE_URL=http://localhost:8081 \
            -e ADMIN_PASSWORD=ci-only-password \
            fun-prompts:smoke
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then healthy=1; break; fi
            sleep 2
          done
          test "${healthy:-0}" = 1
      - name: Check served pages
        run: |
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '/static/htmx.min.js'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ | grep -qi 'content-security-policy'
      - name: Check the gallery and the artifact origin
        run: |
          # Seed import publishes three apps, so the gallery must be non-empty.
          curl -fsS http://127.0.0.1:8080/ | grep -q 'published app'
          curl -fsS http://127.0.0.1:8080/gallery | grep -q 'class="chip"'
          curl -fsS http://127.0.0.1:8080/build/1 | grep -q 'sandbox="allow-scripts"'
          # The artifact is framed from the second origin, with a stricter CSP.
          curl -fsS http://127.0.0.1:8080/build/1 | grep -q 'src="http://localhost:8081/artifact/'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8081/artifact/1 \
            | grep -qi "content-security-policy: default-src 'none'"
          # X-Frame-Options on the artifact would break framing; a Set-Cookie on
          # that origin would break the isolation the second port exists for.
          ! curl -fsS -D - -o /dev/null http://127.0.0.1:8081/artifact/1 | grep -qi 'x-frame-options'
          ! curl -fsS -D - -o /dev/null http://127.0.0.1:8081/artifact/1 | grep -qi 'set-cookie'
          # Downloads are attachments on the gallery origin, never inline HTML.
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/download/build/1 \
            | grep -qi 'content-disposition: attachment; filename="'
      - name: Check the admin gate
        run: |
          # Anonymous /admin is redirected to the login form.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin)" = 303
          # The session cookie is scoped down as hard as it can be.
          headers=$(curl -s -D - -o /dev/null http://127.0.0.1:8080/admin/login)
          echo "$headers" | grep -qi 'set-cookie: fp_admin='
          echo "$headers" | grep -qi 'httponly'
          echo "$headers" | grep -qi 'samesite=strict'
          # A write with no session at all never reaches the action: it is
          # redirected to the login form rather than performed.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/admin/logout)" = 303
          # The whole sign-in, with the token taken from the form.
          jar=$(mktemp)
          token=$(curl -s -c "$jar" http://127.0.0.1:8080/admin/login \
            | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p')
          test -n "$token"
          test "$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d "password=ci-only-password&csrf_token=$token" http://127.0.0.1:8080/admin/login)" = 303
          curl -s -b "$jar" http://127.0.0.1:8080/admin/endpoints | grep -q 'seed'
          # With a live session, a write still needs the csrf token.
          test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8080/admin/logout)" = 403
          test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d 'csrf_token=guessed' http://127.0.0.1:8080/admin/logout)" = 403
          # A guessed password never gets past the gate, token or no token.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'password=wrong' \
            http://127.0.0.1:8080/admin/login)" = 403
          # The configured password never appears in a page.
          ! curl -s -b "$jar" http://127.0.0.1:8080/admin | grep -q 'ci-only-password'
          rm -f "$jar"
      - name: Check the submission, comparison and revise surfaces
        run: |
          # The make-one form is a plain POST form: a textarea for the prompt and
          # one checkbox per enabled pair (none yet, on a fresh container).
          curl -fsS http://127.0.0.1:8080/new | grep -q 'action="/new"'
          curl -fsS http://127.0.0.1:8080/new | grep -q 'name="body"'
          curl -fsS http://127.0.0.1:8080/new | grep -q 'No endpoints are enabled yet'
          # A published build offers a revise box. A follow-up turn adds a version
          # to the published build, so the box exists only once there is one.
          curl -fsS http://127.0.0.1:8080/build/1 | grep -q 'action="/build/1/refine"'
          # One output of one prompt is a valid comparison: a sandboxed frame from
          # the artifact origin, the prompt in its own pinned panel, and the
          # single-output layout that gives the frame the page.
          single=$(curl -fsS 'http://127.0.0.1:8080/compare?b=1')
          echo "$single" | grep -q 'class="compare compare-single"'
          echo "$single" | grep -q 'class="prompt-panel"'
          echo "$single" | grep -q 'sandbox="allow-scripts"'
          echo "$single" | grep -q 'src="http://localhost:8081/artifact/'
          # Frames get an opaque origin: no same-origin escape into the gallery.
          ! echo "$single" | grep -q 'allow-same-origin'
          # The seed publishes one build per prompt, so a selection spanning two
          # prompts is refused rather than quietly comparing unlike inputs.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/compare?b=1&b=2')" = 400
          # Show/hide lives in the URL, so a comparison is a link.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/compare?b=1&hide=1')" = 200
          # A repeated id is one column, not two.
          test "$(curl -fsS 'http://127.0.0.1:8080/compare?b=1&b=1' | grep -c '<iframe')" = 1
          # The prompt page carries the re-run and the fork. (The compare picker
          # only appears once a prompt has two builds to compare, and the seed
          # publishes one build per prompt.)
          slug=$(curl -fsS http://127.0.0.1:8080/build/1 \
            | sed -n 's|.*href="/prompt/\([^"]*\)".*|\1|p' | head -1)
          test -n "$slug"
          curl -fsS "http://127.0.0.1:8080/prompt/$slug" | grep -q "action=\"/prompt/$slug/run\""
          curl -fsS "http://127.0.0.1:8080/prompt/$slug/fork" | grep -q "action=\"/prompt/$slug/fork\""
      - name: Check the same-origin write gate
        run: |
          # The public write routes have no session, so the origin a browser
          # attaches is what stands in for a token. /api/jobs/{id}/cancel takes no
          # body, which is exactly the shape a cross-site HTML form posts
          # successfully, so it is included deliberately.
          for path in /api/jobs/1/cancel /api/prompts /build/1/refine /new; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Origin: http://elsewhere.example' "http://127.0.0.1:8080$path")" = 403
          done
          # The same write with no Origin header is not a cross-site browser
          # request, so it is not refused on that ground.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8080/api/jobs/1/cancel)" != 403
          # A generated app gets no say: the artifact origin is never same-origin.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: http://localhost:8081' http://127.0.0.1:8080/api/prompts)" = 403
      - name: Container logs on failure
        if: failure()
        run: docker logs fun-prompts

  build-push:
    needs: [test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
